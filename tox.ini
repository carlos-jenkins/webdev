[tox]
# Driven by uv via the tox-uv plugin. `uv` is the only tool a contributor needs
# preinstalled; tox + tox-uv create isolated environments and install each
# env's dependencies with uv. Run `tox` (style + test) or `tox -e build`.
requires =
    tox>=4.11
    tox-uv>=1.11
env_list =
    style
    test

[testenv]
package = wheel

[testenv:test]
description = Run the pytest suite.
deps =
    pytest>=8.0
    httpx>=0.27
    websockets>=12.0
commands =
    pytest {posargs}

[testenv:style]
description = Lint, format-check and type-check.
deps =
    ruff>=0.5
    mypy>=1.10
commands =
    ruff check webdev tests
    ruff format --check webdev tests
    mypy webdev

[testenv:build]
description = Build the sdist and wheel and verify the package metadata.
package = skip
deps =
    uv>=0.4
    twine>=5.0
commands =
    uv build
    twine check dist/*

[testenv:run]
description = Build, install and run webdev. Pass args after `--`, e.g.
    `tox -e run -- -p 3000 --no-reload ./public`.
package = wheel
commands =
    webdev {posargs}

